<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Made Laine · Biblioteca de Historias</title>
  <meta name="description" content="Entra a la Biblioteca de Historias de Made Laine.">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #17100d;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }
    .card {
      position: relative;
      width: min(100vw, 720px);
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
      background: #17100d;
    }
    .art {
      width: 100%;
      height: 100svh;
      min-height: 620px;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    /* Clickable button placed over the invitation artwork */
    .enter {
      position: absolute;
      left: 50%;
      bottom: clamp(48px, 7vh, 90px);
      transform: translateX(-50%);
      width: min(72%, 390px);
      min-height: 58px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid rgba(94, 60, 37, .55);
      border-radius: 999px;
      background: linear-gradient(#fff4d9, #f1d8ae);
      color: #3a2418;
      text-decoration: none;
      font-size: clamp(17px, 3vw, 23px);
      letter-spacing: .08em;
      box-shadow: 0 8px 30px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.8);
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .enter:hover {
      transform: translateX(-50%) translateY(-2px);
      box-shadow: 0 12px 34px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.9);
      filter: brightness(1.03);
    }
    .enter:active {
      transform: translateX(-50%) translateY(1px);
    }
    .arrow { font-size: 1.05em; }
    @media (max-width: 480px) {
      .card { width: 100vw; }
      .art { object-position: center top; }
      .enter {
        bottom: 34px;
        width: 78%;
        min-height: 54px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Invitación a Made Laine">
    <img class="art" src="assets/invitacion.png" alt="Biblioteca ilustrada de Made Laine bajo la luna">
    <a class="enter" href="https://www.made-laine.cl/" aria-label="Entrar a Made Laine">
      Entrar a la biblioteca <span class="arrow">→</span>
    </a>
  </main>
</body>
</html>
